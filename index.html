<script>(function(){var el=document.getElementById("vh-splash"),root=document.documentElement;if(!el)return;if(!root.classList.contains("vh-intro")){el.remove();return}
var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var W=[["ephemeral","ক্ষণস্থায়ী"],["benevolent","হিতৈষী"],["resilient","সহনশীল"],["eloquent","বাকপটু"],["meticulous","সূক্ষ্মদর্শী"],["candid","স্পষ্টবাদী"],["tenacious","দৃঢ়প্রতিজ্ঞ"],["lucid","সুস্পষ্ট"],["pragmatic","বাস্তববাদী"],["ambiguous","দ্ব্যর্থক"],["diligent","পরিশ্রমী"],["serene","শান্ত"],["vivid","উজ্জ্বল"],["profound","গভীর"]];
var box=el.querySelector(".vs-words"),n=window.innerWidth<600?9:15,s="",i;
var wide=window.innerWidth>=700,L,T;
for(i=0;i<n;i++){
 if(wide){L=i%2?3+(i*7)%20:72+(i*5)%20;T=6+(i*29)%82}
 else{L=3+(i*31)%72;T=i%2?4+(i*11)%12:80+(i*9)%14}
 s+='<span style="left:'+L+'%;top:'+T+'%;--d:'+((i%7)*.45).toFixed(2)+'s;--t:'+(4.2+(i%4)*.7).toFixed(1)+'s">'+W[i%W.length][0]+"</span>"}
box.innerHTML=s;
var card=el.querySelector(".vs-card"),en=el.querySelector(".vs-en"),bn=el.querySelector(".vs-bn"),k=0;
function show(j){card.classList.remove("on");void card.offsetWidth;en.textContent=W[j][0];bn.textContent=W[j][1];card.classList.add("on")}
show(0);var iv=setInterval(function(){k=(k+1)%3;show(k)},800);
var done=false,tm;
function finish(){if(done)return;done=true;clearInterval(iv);clearTimeout(tm);el.classList.add("out");root.classList.remove("vh-intro");setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},800)}
tm=setTimeout(finish,reduce?1200:2800);
el.addEventListener("click",finish);
document.addEventListener("keydown",function(e){if(done)return;if(e.key==="Escape"||e.key==="Enter"||e.key===" ")finish()});
})();</script>
